name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-java:
    name: Build Java (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ linux, windows ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # coremod 编译期依赖 NanoForge API（mavenLocal SNAPSHOT），CI 需现场发布
      - name: Checkout NanoForge
        uses: actions/checkout@v4
        with:
          repository: NanoForged/NanoForge
          path: NanoForge

      - name: Publish NanoForge to mavenLocal
        working-directory: NanoForge
        run: ./gradlew publishToMavenLocal --console=plain

      # SDG 插件（io.github.nanoforged.sectordevgradle.*）以 SNAPSHOT 发布在 mavenLocal，CI 需现场发布
      - name: Checkout SectorDevGradle
        uses: actions/checkout@v4
        with:
          repository: NanoForged/SectorDevGradle
          path: SectorDevGradle

      - name: Publish SDG plugins to mavenLocal
        working-directory: SectorDevGradle
        run: ./gradlew publishToMavenLocal --console=plain

      # named 游戏 jar 依赖已切换为 SourceSector 本地 maven 仓，CI 现场发布 windows 仓
      - name: Checkout SourceSector
        uses: actions/checkout@v4
        with:
          repository: NanoForged/SourceSector
          path: SourceSector

      - name: Publish named game jars (SourceSector)
        working-directory: SourceSector
        run: ./gradlew :mapping:publishNamedGameJars --console=plain

      - name: Build app jar and mod metadata
        run: |
          ./gradlew :modules:internal:sso-app:modProduction \
            -Pstarsector.gameDir= \
            -Psourcesector.namedRepo=${{ github.workspace }}/SourceSector/build/named-game-repo/windows \
            -x :modules:internal:sso-render:native-render:assemble \
            -x :modules:internal:sso-loading:native-loading:assemble \
            -x :modules:internal:sso-font:native-font:assemble \
            -x :modules:internal:sso-ime:native-ime:assemble

      - name: Run unit tests
        run: |
          ./gradlew test \
            -Pstarsector.gameDir= \
            -Psourcesector.namedRepo=${{ github.workspace }}/SourceSector/build/named-game-repo/windows

      - name: Stage release artifacts
        run: |
          mkdir -p modules/internal/sso-app/build/release-stage
          cp modules/internal/sso-app/build/libs/SSOptimizer.jar modules/internal/sso-app/build/release-stage/
          cp modules/internal/sso-app/build/mod_production/mod_info.json modules/internal/sso-app/build/release-stage/
          cp modules/internal/sso-app/build/mod_production/nanoforge.mod.toml modules/internal/sso-app/build/release-stage/

      - name: Upload app jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar-${{ matrix.platform }}
          path: modules/internal/sso-app/build/release-stage/

  build-native-linux:
    name: Build Native (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfreetype-dev \
            libpng-dev \
            libx11-dev \
            libgl-dev

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native library
        run: |
          ./gradlew :modules:internal:sso-render:native-render:assembleRelease \
            :modules:internal:sso-loading:native-loading:assembleRelease \
            :modules:internal:sso-font:native-font:assembleRelease \
            :modules:internal:sso-ime:native-ime:assembleRelease \
            -Pstarsector.gameDir=

      - name: Collect runtime dependencies
        run: |
          mkdir -p build/runtime-deps
          for lib in libpng16 libfreetype; do
            path=$(ldconfig -p | grep -oP "/[^\s]+${lib}\.so\.\d[^\s]*" | head -1)
            if [ -n "$path" ] && [ -f "$path" ]; then
              cp -L "$path" build/runtime-deps/
              echo "Collected: $(basename $path)"
            fi
          done

      - name: Stage native artifacts
        run: |
          mkdir -p build/stage
          cp modules/internal/sso-render/native/build/lib/main/release/libssoptimizer_render.so build/stage/
          cp modules/internal/sso-loading/native/build/lib/main/release/libssoptimizer_loading.so build/stage/
          cp modules/internal/sso-font/native/build/lib/main/release/libssoptimizer_font.so build/stage/
          cp modules/internal/sso-ime/native/build/lib/main/release/libssoptimizer_ime.so build/stage/
          cp build/runtime-deps/*.so* build/stage/ 2>/dev/null || true

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: build/stage/

  build-native-windows:
    name: Build Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        run: |
          vcpkg install libpng freetype --triplet x64-windows

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native library
        shell: cmd
        run: |
          gradlew.bat :modules:internal:sso-render:native-render:assembleRelease :modules:internal:sso-loading:native-loading:assembleRelease :modules:internal:sso-font:native-font:assembleRelease :modules:internal:sso-ime:native-ime:assembleRelease ^
            -Pstarsector.gameDir= ^
            -Pssoptimizer.native.windows.vcpkgRoot=%VCPKG_INSTALLATION_ROOT% ^
            -Pssoptimizer.native.windows.triplet=x64-windows

      - name: Collect vcpkg runtime dependencies
        shell: pwsh
        run: |
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          $deps = @("libpng16.dll", "freetype.dll", "zlib1.dll", "bz2.dll", "brotlidec.dll", "brotlicommon.dll")
          $staging = "build/runtime-deps"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          foreach ($dll in $deps) {
            $src = Join-Path $vcpkgBin $dll
            if (Test-Path $src) {
              Copy-Item $src $staging
              Write-Host "Collected: $dll"
            }
          }

      - name: Stage native artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/stage | Out-Null
          Copy-Item modules/internal/sso-render/native/build/lib/main/release/ssoptimizer_render.dll build/stage/
          Copy-Item modules/internal/sso-loading/native/build/lib/main/release/ssoptimizer_loading.dll build/stage/
          Copy-Item modules/internal/sso-font/native/build/lib/main/release/ssoptimizer_font.dll build/stage/
          Copy-Item modules/internal/sso-ime/native/build/lib/main/release/ssoptimizer_ime.dll build/stage/
          Copy-Item build/runtime-deps/*.dll build/stage/ -ErrorAction SilentlyContinue

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: build/stage/

  release:
    name: Package & Publish Release
    needs: [ build-java, build-native-linux, build-native-windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble mod package
        run: |
          set -e
          MOD_ID="ssoptimizer"
          VERSION="${{ steps.version.outputs.version }}"
          ROOT_STAGE="build/release-stage"
          LINUX_STAGE="${ROOT_STAGE}/linux"
          WINDOWS_STAGE="${ROOT_STAGE}/windows"
          LINUX_MOD_STAGE="${LINUX_STAGE}/mods/${MOD_ID}"
          WINDOWS_MOD_STAGE="${WINDOWS_STAGE}/mods/${MOD_ID}"

          mkdir -p "${LINUX_MOD_STAGE}/jars" \
                   "${LINUX_MOD_STAGE}/native/linux" \
                   "${LINUX_MOD_STAGE}/fonts" \
                   "${LINUX_STAGE}/graphics/fonts" \
                   "${LINUX_STAGE}/mods/coremods" \
                   "${WINDOWS_MOD_STAGE}/jars" \
                   "${WINDOWS_MOD_STAGE}/native/windows" \
                   "${WINDOWS_MOD_STAGE}/fonts" \
                   "${WINDOWS_STAGE}/starsector-core/graphics/fonts" \
                   "${WINDOWS_STAGE}/mods/coremods"

          cp artifacts/app-jar-linux/SSOptimizer.jar "${LINUX_MOD_STAGE}/jars/SSOptimizer.jar"
          cp artifacts/app-jar-linux/SSOptimizer.jar "${LINUX_STAGE}/mods/coremods/SSOptimizer.jar"
          cp artifacts/app-jar-windows/SSOptimizer.jar "${WINDOWS_MOD_STAGE}/jars/SSOptimizer.jar"
          cp artifacts/app-jar-windows/SSOptimizer.jar "${WINDOWS_STAGE}/mods/coremods/SSOptimizer.jar"

          # 四个功能域原生库平铺部署（产物名即部署名，不再 rename）
          cp artifacts/native-linux/libssoptimizer_render.so artifacts/native-linux/libssoptimizer_loading.so \
             artifacts/native-linux/libssoptimizer_font.so artifacts/native-linux/libssoptimizer_ime.so \
             "${LINUX_MOD_STAGE}/native/linux/"
          cp artifacts/native-windows/ssoptimizer_render.dll artifacts/native-windows/ssoptimizer_loading.dll \
             artifacts/native-windows/ssoptimizer_font.dll artifacts/native-windows/ssoptimizer_ime.dll \
             "${WINDOWS_MOD_STAGE}/native/windows/"

          # Copy runtime dependency libraries (libpng, freetype, zlib, etc.)
          # They are in the same flat directory as the main libraries; skip the four module libraries
          for f in artifacts/native-linux/*.so*; do
            case "$(basename "$f")" in
              libssoptimizer_*.so) continue ;;
            esac
            cp "$f" "${LINUX_MOD_STAGE}/native/linux/" 2>/dev/null || true
          done
          for f in artifacts/native-windows/*.dll; do
            case "$(basename "$f")" in
              ssoptimizer_*.dll) continue ;;
            esac
            cp "$f" "${WINDOWS_MOD_STAGE}/native/windows/" 2>/dev/null || true
          done

          cp artifacts/app-jar-linux/mod_info.json artifacts/app-jar-linux/nanoforge.mod.toml README.md "${LINUX_MOD_STAGE}/"
          cp artifacts/app-jar-windows/mod_info.json artifacts/app-jar-windows/nanoforge.mod.toml README.md "${WINDOWS_MOD_STAGE}/"
          cp log4j.properties "${LINUX_STAGE}/log4j.properties"
          cp log4j.properties "${WINDOWS_STAGE}/starsector-core/log4j.properties"
          cp game-fonts/ttf/* "${LINUX_MOD_STAGE}/fonts/"
          cp game-fonts/ttf/* "${WINDOWS_MOD_STAGE}/fonts/"

          mkdir -p build/distributions
          cd "${LINUX_STAGE}"
          zip -r "../../distributions/SSOptimizer-${VERSION}-linux.zip" .
          cd "${GITHUB_WORKSPACE}/${WINDOWS_STAGE}"
          zip -r "../../distributions/SSOptimizer-${VERSION}-windows.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SSOptimizer ${{ steps.version.outputs.version }}
          files: |
            build/distributions/SSOptimizer-*-linux.zip
            build/distributions/SSOptimizer-*-windows.zip
          generate_release_notes: true
