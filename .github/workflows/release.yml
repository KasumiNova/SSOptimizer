name: Publish signed standalone release

on:
  workflow_dispatch:
    inputs:
      sha256:
        description: SHA-256 of the locally verified Windows x64 obf ZIP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: standalone-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Verify and publish the sole draft asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          PUBLIC_KEY_DER_BASE64: ${{ vars.SSOPTIMIZER_RELEASE_PUBLIC_KEY_DER_BASE64 }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -n "$PUBLIC_KEY_DER_BASE64" ]]
          version="${tag#v}"
          asset="SSOptimizer-Standalone-${version}-windows-x64-obf.zip"
          temporary_dir="$(mktemp -d)"
          archive="$temporary_dir/$asset"
          api="repos/$GITHUB_REPOSITORY/releases"

          release_id="$(gh api --paginate --slurp "$api?per_page=100" |
            jq -er --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] |
              select(length == 1 and .[0].draft) | .[0].id')"

          draft_asset_id() {
            gh api --paginate --slurp "$api/$release_id/assets?per_page=100" |
              jq -er --arg name "$asset" --arg digest "sha256:$EXPECTED_SHA256" \
                '[.[][]] | select(length == 1 and .[0].name == $name and
                  .[0].state == "uploaded" and .[0].digest == $digest) | .[0].id'
          }

          asset_id="$(draft_asset_id)"
          gh api -H 'Accept: application/octet-stream' "$api/assets/$asset_id" > "$archive"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | sha256sum --check
          printf '%s' "$PUBLIC_KEY_DER_BASE64" | base64 --decode > "$temporary_dir/public.der"

          java packaging/standalone/ReleaseFiles.java verify "$archive" packaging/standalone/windows \
            "$version" obf "$temporary_dir/public.der"
          python3 - "$archive" "$temporary_dir/extracted" <<'PY'
          from pathlib import Path
          from shutil import copyfileobj
          from sys import argv
          from zipfile import ZipFile

          with ZipFile(argv[1]) as archive:
              for entry in archive.infolist():
                  if entry.is_dir():
                      continue
                  destination = Path(argv[2], entry.filename)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(entry) as source, destination.open("xb") as target:
                      copyfileobj(source, target)
          PY
          java packaging/standalone/ReleaseFiles.java audit "$temporary_dir/extracted/version" windows obf

          gh api "$api/$release_id" | jq -e --arg tag "$tag" '.draft and .tag_name == $tag'
          [[ "$(draft_asset_id)" == "$asset_id" ]]
          gh api --method PATCH "$api/$release_id" --field draft=false --jq .html_url
