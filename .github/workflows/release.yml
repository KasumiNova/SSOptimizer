name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-java:
    name: Build Java (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ linux, windows ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mapped jar
        run: |
          ./gradlew jarMapped \
            -Pstarsector.gameDir= \
            -Pstarsector.platform=${{ matrix.platform }} \
            -x :native:assemble

      - name: Run unit tests
        run: |
          ./gradlew test \
            -Pstarsector.gameDir= \
            -Pstarsector.platform=${{ matrix.platform }}

      - name: Upload mapped jar
        uses: actions/upload-artifact@v4
        with:
          name: mapped-jar-${{ matrix.platform }}
          path: build/libs/SSOptimizer-mapped.jar

  build-native-linux:
    name: Build Native (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfreetype-dev \
            libpng-dev \
            libx11-dev \
            libgl-dev

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native library
        run: |
          ./gradlew :native:assemble \
            -Pstarsector.gameDir= \
            -Pstarsector.platform=linux

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: native/build/lib/main/debug/libnative.so

  build-native-windows:
    name: Build Native (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg dependencies
        run: |
          vcpkg install libpng freetype --triplet x64-windows

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native library
        shell: cmd
        run: |
          gradlew.bat :native:assemble ^
            -Pstarsector.gameDir= ^
            -Pstarsector.platform=windows ^
            -Pssoptimizer.native.windows.vcpkgRoot=%VCPKG_INSTALLATION_ROOT% ^
            -Pssoptimizer.native.windows.triplet=x64-windows

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: native/build/lib/main/debug/native.dll

  release:
    name: Package & Publish Release
    needs: [ build-java, build-native-linux, build-native-windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble mod package
        run: |
          set -e
          MOD_ID="ssoptimizer"
          VERSION="${{ steps.version.outputs.version }}"
          ROOT_STAGE="build/release-stage"
          LINUX_STAGE="${ROOT_STAGE}/linux"
          WINDOWS_STAGE="${ROOT_STAGE}/windows"
          LINUX_MOD_STAGE="${LINUX_STAGE}/mods/${MOD_ID}"
          WINDOWS_MOD_STAGE="${WINDOWS_STAGE}/starsector-core/mods/${MOD_ID}"

          mkdir -p "${LINUX_MOD_STAGE}/jars" \
                   "${LINUX_MOD_STAGE}/native/linux" \
                   "${LINUX_STAGE}/graphics/fonts" \
                   "${WINDOWS_MOD_STAGE}/jars" \
                   "${WINDOWS_MOD_STAGE}/native/windows" \
                   "${WINDOWS_STAGE}/starsector-core/graphics/fonts"

          cp artifacts/mapped-jar-linux/SSOptimizer-mapped.jar "${LINUX_MOD_STAGE}/jars/SSOptimizer.jar"
          cp artifacts/mapped-jar-windows/SSOptimizer-mapped.jar "${WINDOWS_MOD_STAGE}/jars/SSOptimizer.jar"
          cp artifacts/native-linux/libnative.so "${LINUX_MOD_STAGE}/native/linux/lib${MOD_ID}.so"
          cp artifacts/native-windows/native.dll "${WINDOWS_MOD_STAGE}/native/windows/${MOD_ID}.dll"

          cp mod_info.json README.md "${LINUX_MOD_STAGE}/"
          cp mod_info.json README.md "${WINDOWS_MOD_STAGE}/"
          cp tools/enable_starsector_exe_launch.ps1 "${WINDOWS_MOD_STAGE}/"
          cp tools/enable_starsector_exe_launch.bat "${WINDOWS_MOD_STAGE}/"
          cp game-fonts/fnt/* game-fonts/ttf/* "${LINUX_STAGE}/graphics/fonts/"
          cp game-fonts/fnt/* game-fonts/ttf/* "${WINDOWS_STAGE}/starsector-core/graphics/fonts/"

          cp tools/starsector.sh "${LINUX_STAGE}/starsector.sh"
          cp tools/launch_injected_ss.sh "${LINUX_STAGE}/launch_injected_ss.sh"
          chmod +x "${LINUX_STAGE}/starsector.sh" "${LINUX_STAGE}/launch_injected_ss.sh"

          cp tools/starsector.bat "${WINDOWS_STAGE}/starsector-core/starsector.bat"
          cp tools/enable_starsector_exe_launch.ps1 "${WINDOWS_STAGE}/enable_starsector_exe_launch.ps1"
          cp tools/enable_starsector_exe_launch.bat "${WINDOWS_STAGE}/enable_starsector_exe_launch.bat"

          mkdir -p build/distributions
          cd "${LINUX_STAGE}"
          zip -r "../../distributions/SSOptimizer-${VERSION}-linux.zip" .
          cd "${GITHUB_WORKSPACE}/${WINDOWS_STAGE}"
          zip -r "../../distributions/SSOptimizer-${VERSION}-windows.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SSOptimizer ${{ steps.version.outputs.version }}
          files: |
            build/distributions/SSOptimizer-*-linux.zip
            build/distributions/SSOptimizer-*-windows.zip
          generate_release_notes: true
